<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Pharos</title>
    <script>
      // Apply the saved theme before first paint to avoid a flash. Mirrors src/lib/theme.ts.
      (function () {
        var theme = 'system';
        try {
          theme = localStorage.getItem('pharos-theme') || 'system';
        } catch (e) {}
        var dark =
          theme === 'dark' ||
          (theme === 'system' && matchMedia('(prefers-color-scheme: dark)').matches);
        document.documentElement.classList.toggle('dark', dark);
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
